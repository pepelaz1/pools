<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LP Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background:#f6f8fa; color:#1f2328; }
  .wrap { width:66%; margin:0 auto; padding:16px 24px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  h1 { font-size: 20px; margin: 0; }
  .muted { color:#6b7280; font-size: 12px; }
  .btn { display:inline-flex; align-items:center; gap:8px; background:#0969da; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer; }
  .btn:hover { background:#0860c4; }
  .btn:disabled { opacity:.7; cursor:default; }
  .ring { width:14px; height:14px; border:2px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite; }
  .ring.dark { border-color:rgba(0,0,0,.15); border-top-color:#0969da; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap:12px; margin: 16px 0; }
  .stat { background:#fff; border:1px solid #e1e4e8; border-radius:10px; padding:12px; }
  .stat .k { color:#6b7280; font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
  .stat .v { font-size:18px; font-weight:700; margin-top:4px; }
  .grid { display:grid; grid-template-columns:1fr; gap:16px; }
  .position-columns { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:16px; margin-top:18px; }
  .section { min-width:0; }
  .position-columns .card { padding:10px; }
  .position-columns .row { gap:3px; font-size:12px; }
  .position-columns .row b { letter-spacing:-.15px; white-space:nowrap; }
  .position-columns .fee-row { font-size:11px; }
  .position-columns .sub { font-size:12px; }
  .section-head { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .section-head h2 { font-size:15px; margin:0; }
  .section-head .dot { width:9px; height:9px; border-radius:50%; }
  .section-head .chip { font-size:12px; color:#6b7280; }
  .section-head .price { font-weight:600; font-size:13px; }
  .wallet-card { margin-bottom:12px; }
  .wallet-total { font-size:15px; font-weight:700; margin:4px 0 8px; }
  .wallet-card .row { font-size:11px; }
  .wallet-label { display:flex; align-items:center; gap:5px; }
  .wallet-chain-marker { width:10px; height:10px; border-radius:3px; flex:0 0 auto; }
  .chart-card { padding:10px; margin-bottom:12px; }
  .chart-head { display:flex; align-items:baseline; justify-content:space-between; gap:6px; }
  .chart-head .pair { font-size:12px; }
  .chart-price { font-size:11px; font-weight:700; }
  .chart-svg { display:block; width:100%; height:64px; margin:8px 0 4px; overflow:visible; }
  .chart-meta { display:flex; justify-content:space-between; color:#6b7280; font-size:10px; }
  .card { background:#fff; border:1px solid #e1e4e8; border-radius:12px; padding:12px; }
  .card.out { border-color:#d4a72c; }
  .card-head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:2px 7px; border-radius:5px; color:#fff; font-size:10px; font-weight:600; text-transform:capitalize; }
  .pair { font-weight:700; font-size:14px; }
  .fee { color:#6b7280; font-size:11px; }
  .range-status { font-size:11px; font-weight:600; padding:2px 7px; border-radius:5px; }
  .range-status.in { background:#dafbe1; color:#1a7f37; }
  .range-status.outrange { background:#fff1e5; color:#bc4c00; }
  .sub { color:#6b7280; font-size:11px; margin:6px 0 8px; }
  .range-labels { display:flex; justify-content:space-between; font-size:10px; color:#6b7280; }
  .rangebar { position:relative; height:5px; background:#e1e4e8; border-radius:4px; margin:5px 0 10px; }
  .rangebar-fill { position:absolute; top:0; bottom:0; background:#1a7f37; border-radius:4px; }
  .rangebar-fill.out { background:#bc4c00; }
  .rangebar-dot { position:absolute; top:-2px; width:10px; height:10px; border-radius:50%; background:#1f2328; transform:translateX(-5px); }
  .rows { border-top:1px solid #e1e4e8; margin-top:2px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:12px; border-bottom:1px solid #f0f1f2; }
  .row span { color:#6b7280; }
  .fee-row { gap:6px; font-size:11px; white-space:nowrap; }
  .card-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .value { font-size:16px; font-weight:700; }
  .dim { color:#6b7280; font-size:11px; font-weight:400; }
  .good { color:#1a7f37; }
  .bad { color:#cf222e; }
  .pnl.good { color:#1a7f37; }
  .pnl.bad { color:#cf222e; }
  .card-foot { display:flex; justify-content:flex-end; }
  .mini-btn { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px solid #d0d7de; border-radius:7px; padding:4px 10px; font-size:11px; font-weight:600; color:#0969da; cursor:pointer; }
  .mini-btn:hover { background:#f6f8fa; }
  .mini-btn:disabled { opacity:.6; cursor:default; }
  @media (max-width:1000px) { .wrap { width:100%; } .position-columns { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
  @media (max-width:700px) { .position-columns { grid-template-columns:1fr; } }
  @media (max-width:600px) { .wrap { padding:12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>LP Dashboard</h1>
      <div class="muted" id="updated">—</div>
    </div>
    <button class="btn" id="refreshAll" onclick="refreshAll()">Обновить всё</button>
  </header>

  <div class="stats">
    <div class="stat"><div class="k">Стоимость ликвидности</div><div class="v" id="statValue">—</div></div>
    <div class="stat"><div class="k">Накоплено комиссий</div><div class="v" id="statFees">—</div></div>
    <div class="stat"><div class="k">Награды CAKE</div><div class="v" id="statCake">—</div></div>
    <div class="stat"><div class="k">Позиции (в диапазоне)</div><div class="v" id="statCount">—</div></div>
  </div>

  <div id="sections"></div>
</div>

<script>
function fmt(n, dec, max) {
  if (!isFinite(n)) return "—";
  return n.toFixed(Math.min(dec || 18, max == null ? 4 : max)).replace(/\.?0+$/, "") || "0";
}
function fmtUsd(n) {
  if (!isFinite(n)) return "—";
  return "$" + n.toLocaleString("en-US", { maximumFractionDigits: 2, minimumFractionDigits: 2 });
}
function fmtSignedUsd(n) {
  const value = Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 4, minimumFractionDigits: 2 });
  return `${n >= 0 ? "+" : "-"}$${value}`;
}
function fmtSignedPct(n) {
  return `${n >= 0 ? "+" : ""}${fmt(n, 4)}%`;
}
function badge(text, color) {
  return `<span class="badge" style="background:${color}">${text}</span>`;
}

function renderCard(r) {
  const dexColor = r.dex === "uniswap" ? "#ff007a" : "#1fc7d4";
  const chainColor = { arbitrum: "#12aaff", avalanche: "#e84142", bsc: "#f0b90b" }[r.chain] || "#888";
  const cakeRow = r.cake
    ? `<div class="row"><span>Награды CAKE</span><b>${fmt(r.cake.amount, 18, 4)} CAKE · ${fmtUsd(r.cake.usd)}</b></div>`
    : "";
  const stable = r.chain === "bsc" ? "USDT" : "USDC";
  const rangeDirection = r.rangeDirection || (r.inRange ? "in" : "out");
  const rangeLabel = rangeDirection === "above"
    ? "выше диапазона"
    : rangeDirection === "below"
      ? "ниже диапазона"
      : r.inRange ? "в диапазоне" : "вне диапазона";
  const performanceRows = r.initialValueUsd != null
    ? `
      <div class="row"><span>Внесено при открытии</span><b>${fmtUsd(r.initialValueUsd)}</b></div>
      <div class="row"><span>Цена</span><b>${fmt(r.displayOpeningPrice, 4)} → ${fmt(r.displayCurrentPrice, 4)} (${fmtSignedPct(r.priceChangePct)})</b></div>
      <div class="row"><span>P/L с комиссиями</span><b class="pnl ${r.pnlUsd >= 0 ? "good" : "bad"}">${fmtSignedUsd(r.pnlUsd)} (${fmtSignedPct(r.pnlPct)})</b></div>`
    : "";
  return `
  <div class="card ${r.inRange ? "" : "out"}" id="card-${r.id}">
    <div class="card-head">
      <div>${badge(r.dex, dexColor)} ${badge(r.chainLabel, chainColor)} <span class="pair">${r.displayPair || `${r.sym0}/${r.sym1}`}</span> <span class="fee">${(r.fee / 10000).toFixed(2)}%</span></div>
      <div class="range-status ${r.inRange ? "in" : "outrange"}">${rangeLabel}</div>
    </div>
    <div class="sub">${r.name || ""} · ${r.address.slice(0, 6)}…${r.address.slice(-4)} · ID ${r.tokenId}</div>
    <div class="range-labels"><span>${fmt(r.displayLowerPrice || r.lowerPrice, 4)}</span><span>текущ. ${fmt(r.displayCurrentPrice || r.currentPrice, 4)}</span><span>${fmt(r.displayUpperPrice || r.upperPrice, 4)}</span></div>
    <div class="rangebar"><div class="rangebar-fill ${r.inRange ? "" : "out"}" style="left:0%;width:${r.displayPct == null ? r.pct : r.displayPct}%"></div><div class="rangebar-dot" style="left:${r.displayPct == null ? r.pct : r.displayPct}%"></div></div>
    <div class="rows">
      <div class="row"><span>Ликвидность</span><b>${fmt(r.amt0, r.dec0)} ${r.sym0} + ${fmt(r.amt1, r.dec1)} ${r.sym1}</b></div>
      <div class="row fee-row"><span>Накоплено комиссий</span><b>${fmt(r.fee0, r.dec0)} ${r.sym0} + ${fmt(r.fee1, r.dec1)} ${r.sym1} = ${fmtUsd(r.feeUsd)}</b></div>
      ${cakeRow}
      ${performanceRows}
    </div>
    <div class="card-bottom">
      <div class="value">${fmtUsd(r.valueUsd)} <span class="dim">(в ${stable})</span></div>
      <div class="card-foot"><button class="mini-btn refresh" onclick="refreshOne('${r.id}')">Обновить</button></div>
    </div>
  </div>`;
}

function setLoading(el, on) {
  if (!el) return;
  if (on) {
    el.dataset.html = el.innerHTML;
    const ringCls = el.classList.contains("mini-btn") ? "ring dark" : "ring";
    el.innerHTML = `<span class="${ringCls}"></span>`;
    el.disabled = true;
  } else {
    el.disabled = false;
    if (el.dataset.html) el.innerHTML = el.dataset.html;
  }
}

const CHAIN_COLORS = { arbitrum: "#12aaff", avalanche: "#e84142", bsc: "#f0b90b" };

function renderSection(chainLabel, chainKey, positions, price) {
  const total = positions.reduce((a, r) => a + r.valueUsd, 0);
  const color = CHAIN_COLORS[chainKey] || "#888";
  const priceHtml = price && price.price != null
    ? `<span class="price">${price.sym} · ${fmtUsd(price.price)}</span>`
    : "";
  const cards = positions.map(renderCard).join("");
  return `
  <div class="section">
    <div class="section-head">
      <span class="dot" style="background:${color}"></span>
      <h2>${chainLabel}</h2>
      ${priceHtml}
      <span class="chip">${positions.length} поз. · ${fmtUsd(total)}</span>
    </div>
    <div class="grid">${cards}</div>
  </div>`;
}

function renderWalletSection(wallets) {
  const color = "#6b7280";
  const perWallet = new Map();
  for (const group of wallets) {
    for (const wallet of group.wallets) {
      const key = wallet.address.toLowerCase();
      if (!perWallet.has(key)) perWallet.set(key, { ...wallet, balances: [] });
      perWallet.get(key).balances.push({
        chain: group.chain,
        chainLabel: group.chainLabel,
        symbol: group.symbol,
        amount: wallet.amount,
      });
    }
  }
  const cards = [...perWallet.values()].map((wallet) => {
    const total = wallet.balances.some((balance) => !isFinite(balance.amount))
      ? null
      : wallet.balances.reduce((sum, balance) => sum + balance.amount, 0);
    const rows = wallet.balances.map((balance) => `
      <div class="row"><span class="wallet-label"><span class="wallet-chain-marker" style="background:${CHAIN_COLORS[balance.chain] || color}" title="${balance.chainLabel}"></span>${balance.symbol}</span><b>${fmt(balance.amount, 18)} ${balance.symbol}</b></div>`).join("");
    return `
      <div class="card wallet-card">
        <div class="card-head"><div><span class="pair">${wallet.name || "Кошелёк"}</span></div></div>
        <div class="sub">${wallet.address.slice(0, 6)}…${wallet.address.slice(-4)}</div>
        <div class="rows">${rows}</div>
        <div class="wallet-total">Всего: ${total == null ? "—" : `${fmt(total, 18)} USD`}</div>
      </div>`;
  }).join("");
  return `
    <div class="section">
      <div class="section-head"><span class="dot" style="background:${color}"></span><h2>Кошельки</h2></div>
      <div class="grid">${cards}</div>
    </div>`;
}

function renderChart(points, color) {
  const values = points.map((point) => point[1]).filter(isFinite);
  if (values.length < 2) return '<div class="muted">Нет данных</div>';
  const min = Math.min(...values);
  const max = Math.max(...values);
  const spread = max - min || max * 0.01 || 1;
  const line = points.map((point, index) => {
    const x = (index / (points.length - 1)) * 100;
    const y = 60 - ((point[1] - min) / spread) * 56;
    return `${x.toFixed(2)},${y.toFixed(2)}`;
  }).join(" ");
  return `<svg class="chart-svg" viewBox="0 0 100 64" preserveAspectRatio="none" aria-label="График цены"><line x1="0" y1="60" x2="100" y2="60" stroke="#e1e4e8" stroke-width="1"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function renderChartsSection(charts) {
  const cards = Object.values(charts || {}).map((chart) => {
    const points = chart.prices || [];
    const first = points[0]?.[1];
    const last = points.at(-1)?.[1];
    const change = isFinite(first) && first !== 0 && isFinite(last) ? ((last / first) - 1) * 100 : null;
    const changeClass = change == null ? "" : change >= 0 ? "good" : "bad";
    return `<div class="card chart-card">
      <div class="chart-head"><span class="pair">${chart.pair}</span><span class="chart-price">${isFinite(last) ? fmtUsd(last) : "—"}</span></div>
      ${renderChart(points, chart.color)}
      <div class="chart-meta"><span>24ч</span><span class="${changeClass}">${change == null ? "—" : fmtSignedPct(change)}</span></div>
    </div>`;
  }).join("");
  return `<div class="section"><div class="section-head"><span class="dot" style="background:#6b7280"></span><h2>Графики</h2></div><div class="grid">${cards}</div></div>`;
}

function renderAll(positions, prices, wallets, charts) {
  prices = prices || {};
  const order = [["arbitrum", "Uniswap ETH/USDC"], ["avalanche", "Uniswap AVAX/USDC"], ["bsc", "PancakeSwap BNB/USDT"]];
  const groups = {};
  for (const p of positions) (groups[p.chain] = groups[p.chain] || []).push(p);

  let columns = "";
  for (const [key, label] of order) {
    if (groups[key]) columns += renderSection(label, key, groups[key], prices[key]);
  }
  for (const key of Object.keys(groups)) {
    if (!order.some((o) => o[0] === key)) columns += renderSection(key, key, groups[key], prices[key]);
  }
  columns += renderWalletSection(wallets || []);
  columns += renderChartsSection(charts || {});

  document.getElementById("sections").innerHTML = `<div class="position-columns">${columns}</div>`;
  document.getElementById("statValue").textContent = fmtUsd(positions.reduce((a, r) => a + r.valueUsd, 0));
  document.getElementById("statFees").textContent = fmtUsd(positions.reduce((a, r) => a + r.feeUsd, 0));
  document.getElementById("statCake").textContent = fmtUsd(positions.reduce((a, r) => a + (r.cake ? r.cake.usd : 0), 0));
  const inRange = positions.filter((r) => r.inRange).length;
  document.getElementById("statCount").textContent = `${positions.length} (${inRange})`;
}

async function refreshAll() {
  const btn = document.getElementById("refreshAll");
  setLoading(btn, true);
  try {
    const res = await fetch("/api/positions");
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    renderAll(data.positions, data.prices, data.wallets, data.charts);
    document.getElementById("updated").textContent = "Обновлено: " + new Date(data.updated).toLocaleString("ru-RU");
  } catch (e) {
    alert("Ошибка: " + e.message);
  } finally {
    setLoading(btn, false);
  }
}

async function refreshOne(id) {
  const card = document.getElementById("card-" + id);
  if (!card) return;
  const btn = card.querySelector(".refresh");
  setLoading(btn, true);
  try {
    const res = await fetch("/api/positions/" + encodeURIComponent(id));
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    const p = data.position;
    const tmp = document.createElement("div");
    tmp.innerHTML = renderCard(p);
    card.replaceWith(tmp.firstElementChild);
    document.getElementById("updated").textContent = "Обновлено: " + new Date(data.updated).toLocaleString("ru-RU");
  } catch (e) {
    alert("Ошибка: " + e.message);
    setLoading(btn, false);
  }
}

refreshAll();
</script>
</body>
</html>
